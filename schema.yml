        schema:
          type: integer
      - in: query
        name: is_published
        schema:
          type: boolean
      - in: query
        name: level
        schema:
          type: string
          title: Уровень
          enum:
          - advanced
          - beginner
          - intermediate
        description: |-
          * `beginner` - Начальный
          * `intermediate` - Средний
          * `advanced` - Продвинутый
      - name: ordering
